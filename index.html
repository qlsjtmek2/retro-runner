<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RETRO RUNNER</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: monospace;
        overflow: hidden;
      }

      #app-wrapper {
        display: flex;
        gap: 40px;
        align-items: center;
      }

      #controls,
      #mobile-controls {
        user-select: none;
      }

      #controls h2,
      #mobile-controls h2 {
        font-size: 32px;
        margin-bottom: 20px;
        color: #00ffff;
        -webkit-text-stroke: 4px #000033;
        paint-order: stroke fill;
      }

      #controls .key-info,
      #mobile-controls .key-info {
        margin: 10px 0;
        font-size: 18px;
        color: #ffff00;
        display: flex;
        align-items: center;
        gap: 12px;
        -webkit-text-stroke: 2px #000033;
        paint-order: stroke fill;
      }

      #controls .key,
      #mobile-controls .key {
        background: #1a1a2e;
        border: 2px solid #00ffff;
        padding: 6px 10px;
        border-radius: 4px;
        display: inline-block;
        text-align: center;
        color: #00ffff;
        -webkit-text-stroke: 2px #000033;
        paint-order: stroke fill;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      }

      /* 데스크탑에서는 모바일 컨트롤 숨기기 */
      #mobile-controls {
        display: none;
      }

      #game-container {
        position: relative;
        box-shadow:
          0 0 30px rgba(255, 255, 0, 0.5),
          0 0 60px rgba(168, 85, 247, 0.3),
          inset 0 0 100px rgba(0, 0, 0, 0.8);
        border: 4px solid transparent;
        border-radius: 8px;
        background:
          linear-gradient(#0f0f23, #0f0f23) padding-box,
          linear-gradient(90deg,
            #8B5CF6 0%,
            #FF6B9D 16.67%,
            #FF8C42 33.33%,
            #FFD93D 50%,
            #6BCF7F 66.67%,
            #4D9DE0 83.33%,
            #8B5CF6 100%
          ) border-box;
      }

      /* CRT Scanline 효과 */
      #game-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 2px
        );
        pointer-events: none;
        z-index: 1000;
        animation: scanline 8s linear infinite;
      }

      /* CRT 커브 효과 */
      #game-container::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          ellipse at center,
          transparent 0%,
          transparent 70%,
          rgba(0, 0, 0, 0.3) 100%
        );
        pointer-events: none;
        z-index: 999;
        border-radius: 8px;
      }

      /* Scanline 애니메이션 */
      @keyframes scanline {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 0 100%;
        }
      }

      /* CRT 글리치 효과 (가끔) */
      @keyframes glitch {
        0%, 90%, 100% {
          transform: translate(0);
        }
        92% {
          transform: translate(-2px, 2px);
        }
        94% {
          transform: translate(2px, -2px);
        }
        96% {
          transform: translate(-2px, -2px);
        }
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* 모바일 반응형 */
      @media (max-width: 768px) {
        body {
          padding: 0;
        }

        #app-wrapper {
          flex-direction: row-reverse;
          gap: 20px;
          width: 100vw;
          height: 100vh;
          padding: 20px;
          box-sizing: border-box;
          align-items: flex-start;
        }

        #controls {
          display: none;
        }

        #mobile-controls {
          display: block;
          flex-shrink: 0;
        }

        #mobile-controls h2 {
          font-size: 24px;
          margin-bottom: 15px;
        }

        #mobile-controls .key-info {
          font-size: 14px;
          margin: 8px 0;
        }

        #mobile-controls .key {
          font-size: 16px;
          padding: 4px 8px;
        }

        #game-container {
          flex: 1;
          min-width: 0;
          box-shadow: none;
          border: 2px solid #00ffff;
          border-radius: 4px;
        }

        #game-container::before,
        #game-container::after {
          display: none;
        }
      }

      /* 세로 모드 또는 작은 화면에서는 컨트롤 숨기기 */
      @media (max-height: 600px), (max-width: 480px) {
        #app-wrapper {
          flex-direction: column;
          padding: 0;
          gap: 0;
        }

        #mobile-controls {
          display: none !important;
        }

        #game-container {
          width: 100vw;
          height: 100vh;
          border: none;
        }
      }

    </style>
    <script type="module" crossorigin src="/retro-runner/assets/index-D4qOiTMH.js"></script>
  </head>
  <body>
    <div id="app-wrapper">
      <div id="controls">
        <h2>CONTROLS</h2>
        <div class="key-info">
          <span class="key">←</span>
          <span>MOVE LEFT</span>
        </div>
        <div class="key-info">
          <span class="key">→</span>
          <span>MOVE RIGHT</span>
        </div>
        <div class="key-info">
          <span class="key">↑</span>
          <span>JUMP (x2)</span>
        </div>
        <div class="key-info">
          <span class="key">↓</span>
          <span>FAST FALL</span>
        </div>
      </div>
      <div id="game-container"></div>
      <div id="mobile-controls">
        <h2>TOUCH CONTROLS</h2>
        <div class="key-info">
          <span class="key">👆</span>
          <span>SWIPE UP: JUMP</span>
        </div>
        <div class="key-info">
          <span class="key">👇</span>
          <span>SWIPE DOWN: FALL</span>
        </div>
        <div class="key-info">
          <span class="key">👈</span>
          <span>TAP LEFT: MOVE LEFT</span>
        </div>
        <div class="key-info">
          <span class="key">👉</span>
          <span>TAP RIGHT: MOVE RIGHT</span>
        </div>
      </div>
    </div>
  </body>
</html>
