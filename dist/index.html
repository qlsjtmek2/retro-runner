<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RETRO RUNNER</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Courier New', monospace;
        overflow: hidden;
      }

      #game-container {
        position: relative;
        box-shadow:
          0 0 30px rgba(255, 255, 0, 0.5),
          0 0 60px rgba(168, 85, 247, 0.3),
          inset 0 0 100px rgba(0, 0, 0, 0.8);
        border: 4px solid transparent;
        border-radius: 8px;
        background:
          linear-gradient(#0f0f23, #0f0f23) padding-box,
          linear-gradient(90deg,
            #8B5CF6 0%,
            #FF6B9D 16.67%,
            #FF8C42 33.33%,
            #FFD93D 50%,
            #6BCF7F 66.67%,
            #4D9DE0 83.33%,
            #8B5CF6 100%
          ) border-box;
      }

      /* CRT Scanline 효과 */
      #game-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 2px
        );
        pointer-events: none;
        z-index: 1000;
        animation: scanline 8s linear infinite;
      }

      /* CRT 커브 효과 */
      #game-container::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          ellipse at center,
          transparent 0%,
          transparent 70%,
          rgba(0, 0, 0, 0.3) 100%
        );
        pointer-events: none;
        z-index: 999;
        border-radius: 8px;
      }

      /* Scanline 애니메이션 */
      @keyframes scanline {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 0 100%;
        }
      }

      /* CRT 글리치 효과 (가끔) */
      @keyframes glitch {
        0%, 90%, 100% {
          transform: translate(0);
        }
        92% {
          transform: translate(-2px, 2px);
        }
        94% {
          transform: translate(2px, -2px);
        }
        96% {
          transform: translate(-2px, -2px);
        }
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

    </style>
    <script type="module" crossorigin src="/assets/index-BTR1PKy_.js"></script>
  </head>
  <body>
    <div id="game-container"></div>
  </body>
</html>
